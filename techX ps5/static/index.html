<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAG Document QA</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <div class="container">

    <!-- Left: Document Management -->
    <div class="panel panel-docs">
      <h2>Documents</h2>

      <div class="upload-area" id="dropzone">
        <input type="file" id="fileInput" accept=".pdf,.txt" multiple hidden>
        <p>Click or drop files here</p>
        <span class="hint">PDF, TXT</span>
      </div>

      <div class="file-list" id="docList">
        <p class="muted">Loading...</p>
      </div>

      <div class="index-section">
        <div class="index-options">
          <label>Chunk size <input type="number" id="chunkSize" value="1000" min="200" max="4000" step="100"></label>
          <label>Overlap <input type="number" id="chunkOverlap" value="200" min="0" max="500" step="50"></label>
        </div>
        <button class="btn" id="btnIndex">Index Documents</button>
      </div>

      <div class="db-info">
        <span>Chunks indexed: <strong id="indexedChunksCount">0</strong></span>
        <button class="btn-link danger" id="btnClearDb">Clear DB</button>
      </div>
    </div>

    <!-- Right: Query -->
    <div class="panel panel-query">
      <h2>Ask a Question</h2>

      <form id="queryForm" class="query-box">
        <div class="query-row">
          <input type="text" id="queryInput" placeholder="Type your question..." autocomplete="off" required>
          <button type="submit" class="btn" id="btnSubmit">Ask</button>
        </div>
        <div class="query-options">
          <label>Top chunks:
            <select id="topKSelect">
              <option value="2">2</option>
              <option value="3" selected>3</option>
              <option value="5">5</option>
            </select>
          </label>
        </div>
      </form>

      <!-- Results -->
      <div class="results" id="resultsContainer">
        <div id="welcomeBox" class="placeholder-msg">
          Upload some documents, index them, then ask a question.
        </div>

        <div id="answerCard" class="answer-card" style="display:none;">
          <div class="answer-question" id="userQueryDisplay"></div>
          <div class="answer-text" id="answerBody"></div>
          <div class="answer-meta" id="responseMeta"></div>

          <div class="sources-section" id="sourcesDrawer" style="display:none;">
            <button class="btn-link" id="sourcesToggle">Show sources (<span id="sourceCount">0</span>)</button>
            <div class="sources-list" id="sourcesContent" style="display:none;"></div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <div class="toast" id="toast"></div>

  <script src="/static/app.js"></script>
</body>
</html>
